<!DOCTYPE html>
<html lang ="en">
<head>
    <meta charset ="UTF-8">
    <title> Add Screening - CineBook</title>
    <link rel ="stylesheet" href ="{{url_for('static',filename ='style.css')}}">
</head>
<body>
<h1> Add New Screening</h1>
{% if error %}
 <p> {{ error}}</p>
{% endif%}
<form method ="POST">
    <label>Film</label>
    <select name = "FilmID" required>
        <option value ="">Select a film </option>
        {% for film in films %}
            <option value="{{film['filmID']}}">
                {{film['Title']}}
            </option>
        {%endfor%}

    </select>
    <label>Screening Date </label>
    <input type = "date" name="ScreeningDate" required>
    <label>Screening Time</label>
    <input type = "time" name = "ScreeningTime" required>
    <label> Screen Number</label>
    <input type ="number" name = "ScreenNumber" min ="1" required>
    <button type = "submit"> Add Screening </button>
    <a href = "{{url_for('manage_screenings')}}">cancel</a>
</form>
</body>
</html>
