<!doctype html>
<html lang="en">
    <head>
        <meta charset ="utf-8">
        <title>cineBOOK - manage screenings</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <h1>Manage Screenings</h1>
        {% for screening in screenings %}
        <div class ="screening-card ">
            <h3>{{screening['Title']}}</h3>
            <p>screening date:{{screening ['ScreeningDate']}}</p>
            <p>screening time:{{screening['ScreeningTime']}}</p>
            <p>screen number:{{screening['ScreenNumber']}}</p>
            <a href = "{{url_for('edit_screening',screening_id=screening['screeningID'])}}">Edit</a>
            <form method ="POST" action ="{{url_for('delete_screening',screening_id=screening['screeningID'])}}" style ="display:inline">
                <button type="submit">Delete</button>
            </form>
        </div>
        {% endfor %}
    </body>
</html>
