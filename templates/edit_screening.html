<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="UTF -8">
    <title>Edit Screening - CineBOOK</title>
    <link rel ="stylesheet" href = "{{url_for('static',filename = 'style.css')}}">
</head>
<body>
<h1>Edit Screening</h1>
{% if error %}
    <p> {{ error }}</p>
{%endif%}
<form method ="POST">
    <label>Film</label>
<select name = "FilmID" required>
    {% for film in films%}
    <option value = "{{film['filmID']}}"
        {% if film ['filmID'] == screening['FilmID']%}
            selected
        {% endif %}>
        {{ film['Title']}}
    </option>
    {%endfor%}
    </select>
    <label>Screening Date</label>
    <input type ="date" name = "ScreeningDate" value ="{{ screening['ScreeningDate']}}" required>

    <label>Screening time</label>
    <input type ="time" name = "ScreeningTime" value ="{{ screening['ScreeningTime']}}" required>

    <label>Screen Number</label>
    <input type ="number" name = "ScreenNumber" value ="{{ screening['ScreenNumber']}}"  min ="1" required>
    <div class ="form-actions">
        <button type ="sumbit">Save Changes </button>
         <a href = "{{url_for ('manage_screenings')}}" class ="cancel-button">Cancel</a>

    </div>
</form>
</body>
</html>
