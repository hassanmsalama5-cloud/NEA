<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <title>CineBook-GENRE</title>
</head>
<body>
    <h1>Welcome to CineBook</h1>
    <p> select your genre to see the movies</p>
    <form method ="POST">
        <label for="horror">Horror:</label><br>
        <input name ="horror" type = "text" required><br>
        <button type="submit">select</button>
        <label for="comedy">Comedy:</label><br>
        <input name ="comedy" type = "text" required><br>
        <button type="submit">select</button>
        <label for="action">Action:</label><br>
        <input name ="action" type = "text" required><br>
        <button type="submit">select</button>
        <label for="sci-fi">Sci-Fi:</label><br>
        <input name ="sci-fi" type = "text" required><br>
        <button type="submit">select</button>
        <label for ="thriller">Thriller:</label><br>
        <input name ="thriller" type = "text" required><br>
        <button type="submit">select</button>
    </form>
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
</html>
