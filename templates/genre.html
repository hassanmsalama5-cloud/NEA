<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <title>CineBook-GENRE</title>
     <!-- <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> -->
</head>
<body>
    <h1>Welcome to CineBook</h1>
    <p> select your genre to see the movies:</p>
    <form action="{{ url_for('films', genre='horror') }}" method="get">
        <button type="submit">horror</button>
    </form>
    <form action="{{ url_for('films', genre='comedy') }}" method="get">
        <button type="submit">comedy</button>
    </form>
    <form action="{{ url_for('films', genre='action') }}" method="get">
        <button type="submit">action</button>
    </form>
    <form action="{{ url_for('films', genre='sci-fi') }}" method="get"> 
        <button type="submit">sci-fi</button>
    </form>
    <form action="{{ url_for('films', genre='thriller') }}" method="get">
        <button type="submit">thriller</button>
    </form>
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
</html>
