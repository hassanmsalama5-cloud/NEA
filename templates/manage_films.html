<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>CineBook-MANAGE FILMS</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
    {%for film in films%}
    <div class = "film-card">
            <h3>{{film['title']}}</h3>
            <p>genre:{{film['genre']}}</p>§
            <p>age rating:{{film['age_rating']}}</p>
            <p>duration:{{film['duration']}} in minutes </p>
            <p>description:{{film['description']}}</p>
            <a href = "{{url_for('edit_film',film_id=film['id'])}}">Edit</a>
        
        <form method ="POST" action ="{{url_for('delete_film',film_id=film['id'])}}" style="display: inline;">
            <button type="submit">Delete</button>
        </form>
    </div>
    {%endfor%}
    </body>
</html>
