<!DOCTYPE html>
<html lang ="en">
<head>
    <meta charset ="UTF-8">
    <title>Edit Booking - CineBook</title>
    <link rel ="stylesheet"
        href = "{{url_for('static',filename='style.css')}}">
</head>
<body>
    <h1>edit Booking # {{booking['bookingID']}}</h1>
    <form method = "POST">
        <h2>Select Screening </h2>
        <select name ="screening_id" id = "screening" required>
            {% for screening in screenings %}
            <option value ="{{screening['ScreeningID']}}"
                {% if screening['screeningID'] == booking['screeningID']%}
                selected
                {% endif %}>
                {{screening['Title']}}
                - {{screening['ScreeningDate']}}
                - Screen{{screening['ScreenNumber']}}
            </option>
            {% endfor %}
        </select>
        <h2>Select Seats</h2>
        {% for screening in screenings%}
            <div class ="screening-seats"
                 data-screenings="{{screening['ScreeningID']}}"
                 {% if screening['screening'] !=  booking['ScreeningID']%}
                    hidden
                {%endif%}>
            <h3>{{screening['Title']}}</h3>
            {% for seat in seats_by_screening[screening['Screening']]%}
            <label>
                <input
                 type ="checkbox"
                 name = "seat_ids"
                 value = "{{seat['seatID']}}"
                 {% if seat['IsCurrentBooking'] ==1%}
                    checked
                {%endif%}
                {%if seat['IsAvailable'] ==0 % and seat[IsCurrentBooking']==0%}
                disabled
                {%endif%}
                >
                {{seat['seatNumber']}}
                {% if seat ['IsCurrentBooking']==1%}
                    (Currently booked)
                {% elif seat['IsAvailable'] == 0%}
                    (Unavailable)
                {% endif%}

            </label>
            {%endfor%}
            </div>
        {%endfor%} 
    <h2> Booking Summary</h2>   
    <p> 
        Number of tickets:
        <span id ="ticket-count">0</span>
    </p>
    <p>
        Total price:
        £<span id = "total-price">0.00</span>
    </p>
    <button type ="submit">Save Changes</button>
    <a href ="{{url_for('manage_bookings')}}">Cancel</a>
    </form>
<script>
    const screeningSelect = document.getElementById("screening");
    const seatGroups = document.querySelectorAll(".screening-seats");
    function updateSeats(){
        const selectScreening = screeningSelect.values;
        seatGroups.forEach(group=>{
            if (group.data.set.screening === selectScreening){
                group.hidden = false;

            } else{
                group.hidden = true;
                group.querySelectorAll(
                    'input[name="seat_ids"]'
                ).forEach(checkbox =>{
                    checkbox.checked= false;
                });
            }
        });
    updateTotal();
    }
    function updateTotal(){
        const selectedSeats = document.querySelectorAll(
            'input[name="seat_ids"]:checked'
        );
    const ticketCount = selectedSeats.length;
    const totalPrice = ticketCount * 10.99;
    document.getElementById("ticket-count").textContent = ticketCount;
    docuent.getElementById("total-price").textContent = totalPrice.toFixed(2);
    }

    screeningSelect.addEventlistener("change,updateSeats");
    document.querySelectorAll(
        'input[name="seat_ids"]'

        ).forEach(checkbox =>{
            checkbox.addEventListener("change",updateTotal);
        });
        updateTotal();
</script>
</body>
</html>
