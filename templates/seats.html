<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seating Selection Chart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='seats.css') }}">
</head>
<body>
    <h1>Seating Selection Chart for {{ film_name }}</h1>
    <h1>ScreenID: {{ screening_id }}</h1>
    <form action ="{{url_for('confirm_booking')}}" method="POST" id="booking-form">
        <input type ="hidden" name ="screening_id" value="{{screening_id}}">
     <div class="seat-chart">
        {% for row in seat_by_row %}
        <div class="seat-row">
            <span class="row-label">{{row[0].row}}</span>
            {%for seat in row%}
            <button class="seat {{ 'available' if  not seat.booked else 'unavailable' }}" data-seat-id="{{seat.id}}" 
            {%if seat.booked%}disabled{%endif%}>
                {{'x'if seat.booked else '♟'}}
            </button>
            {%endfor%}
        </div>
        {%endfor%}
    </div> 
     <p> selected seats: <span id="selected-seats">0</span></p>
     <div id = "selected-seat-inputs"></div>
     <button type ="submit">Confirm Booking</buttton>
    </form>
     <script>
     const seats = document.querySelectorAll('.seat.available');
     const count  = document.getElementById('selected-seats');
     const selectedInputs = document.getElementById('selected-seat-inputs');
     seats.forEach(seat=>{
        seat.addEventListener('click',()=>{
            seat.classList.toggle('selected');
            selectedInputs.innerHTML = '';
            document.querySelectorAll('.seat.selected').forEach(selected=>{
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name ='seat_ids';
                input.value = selected.dataset.seatId;

                selectedInputs.appendChild(input);
            })
            count.textContent = document.querySelectorAll('.seat.selected').length;
        })
     })
        </script>
</body>
</html>
